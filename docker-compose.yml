services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile.pi
    container_name: pi-agent
    restart: unless-stopped
    env_file: .env
    environment:
      PGVEC_URL: http://pgvec-memory:8090/mcp
      PGVEC_OWNER: system
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: pi-agent
      PI_OTEL_ENABLED: ${PI_OTEL_ENABLED:-true}
    working_dir: /root/.pi/agent
    volumes:
      - ./workspace:/workspace
      - pi-agent-home:/root/.pi/agent
      - ./.pi:/etc/pi-skel:ro
      - ./extensions:/extensions
    depends_on:
      pgvec-memory:
        condition: service_healthy
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x pi >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  memory-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: pi-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: densemem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: densemem
    volumes:
      - memory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"densemem\" -d \"densemem\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgvec-memory:
    build:
      context: ./memory
    container_name: pi-pgvec-memory
    restart: unless-stopped
    environment:
      PGVEC_HTTP_ADDR: ":8090"
      PGVEC_PG_HOST: memory-db
      PGVEC_PG_PORT: "5432"
      PGVEC_PG_USER: ${POSTGRES_USER:-densemem}
      PGVEC_PG_PASSWORD: ${POSTGRES_PASSWORD}
      PGVEC_PG_DATABASE: ${POSTGRES_DB:-densemem}
      PGVEC_MAX_RESULTS: "10"
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS}
    ports:
      - "127.0.0.1:${PGVEC_PORT:-8090}:8090"
    depends_on:
      memory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tolerant: extension drops batches until Jaeger is up, so no depends_on gate.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pi-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ""
      METRICS_STORAGE_TYPE: ""
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pi-agent-home:
  memory-db-data:
