services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile.pi
    container_name: pi-agent
    restart: unless-stopped
    env_file: .env
    environment:
      PI_DENSE_MEM_URL: http://dense-mem:8080/mcp
      PI_DENSE_MEM_AUTH_HEADER: "Bearer ${DENSE_MEM_API_KEY:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: pi-agent
      PI_OTEL_ENABLED: ${PI_OTEL_ENABLED:-true}
    volumes:
      - ./workspace:/workspace
      - pi-agent-home:/root/.pi/agent
      - ./.pi:/workspace/.pi
      - ./.pi/models.json:/root/.pi/agent/models.json:ro
    depends_on:
      memory-db:
        condition: service_healthy
      dense-mem:
        condition: service_healthy
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f pi-coding-agent >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  memory-db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: pi-memory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: densemem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: densemem
    volumes:
      - memory-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"densemem\" -d \"densemem\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dense-mem:
    image: ghcr.io/markhuangai/dense-mem:latest
    container_name: pi-dense-mem
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CONTROL_HTTP_ADDR: ":8090"
      CONTROL_PORTAL_TOKEN: ${CONTROL_PORTAL_TOKEN}
      POSTGRES_USER: densemem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: densemem
      POSTGRES_HOST: memory-db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: ""
      DISTRIBUTED_COORDINATION_REQUIRED: "false"
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_EMBEDDING_MODEL: ${AI_API_EMBEDDING_MODEL}
      AI_API_EMBEDDING_DIMENSIONS: ${AI_API_EMBEDDING_DIMENSIONS}
      AI_VERIFIER_API_URL: ${AI_VERIFIER_API_URL}
      AI_VERIFIER_API_KEY: ${AI_VERIFIER_API_KEY}
      AI_VERIFIER_MODEL: ${AI_VERIFIER_MODEL}
      AI_VERIFIER_TIMEOUT_SECONDS: ${AI_VERIFIER_TIMEOUT_SECONDS:-300}
      AI_VERIFIER_MAX_INPUT_TOKENS: "64000"
      AI_VERIFIER_MAX_OUTPUT_TOKENS: "8192"
    ports:
      - "127.0.0.1:${DENSE_MEM_PORT:-8080}:8080"
      - "127.0.0.1:${CONTROL_PORTAL_PORT:-8090}:8090"
    depends_on:
      memory-db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tolerant: extension drops batches until Jaeger is up, so no depends_on gate.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pi-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ""
      METRICS_STORAGE_TYPE: ""
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4318:4318"     # OTLP/HTTP traces from pi-agent
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pi-agent-home:
  memory-db-data:
